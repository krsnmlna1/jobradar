name: jobradar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobradar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./software/api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobradar -d jobradar"]
      interval: 2s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: software/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD}@db:5432/jobradar
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
