name: jobradar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobradar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./software/api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobradar -d jobradar"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: software/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD}@db:5432/jobradar
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scraper:
    build:
      context: .
      dockerfile: automation/scraper/Dockerfile
    command: ["scraper", "--api-url", "http://api:8000"]
    depends_on:
      - api
    profiles: ["jobs"]
    environment:
      HC_PING_URL: ${HC_PING_URL:-}
  triage:
    build:
      context: .
      dockerfile: ai/triage/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD}@db:5432/jobradar
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
    profiles: ["web"]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
