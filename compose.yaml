name: jobradar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobradar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./software/api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
