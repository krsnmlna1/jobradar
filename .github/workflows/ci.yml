name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f software/api/Dockerfile -t jobradar-api .

      - run: docker build -f automation/scraper/Dockerfile -t jobradar-scraper .
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jobradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://jobradar:ci-only@localhost:5432/jobradar_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"

      - run: uv sync --all-packages --frozen

      - run: uv run ruff check

      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f software/api/schema.sql

      - run: uv run pytest

